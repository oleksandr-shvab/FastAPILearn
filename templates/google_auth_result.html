<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Signed in with Google</title>
</head>
<body style="font-family: sans-serif; max-width: 480px; margin: 80px auto; text-align: center;">
  <h3>Signed in with Google</h3>

  <h4>access_token (for manual testing in /docs or curl):</h4>
  <textarea rows="6" style="width: 100%;" readonly>{{ access_token }}</textarea>

  <h4>refresh_token:</h4>
  <textarea rows="6" style="width: 100%;" readonly>{{ refresh_token }}</textarea>
</body>
</html>
